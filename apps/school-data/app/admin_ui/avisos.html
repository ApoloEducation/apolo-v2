<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avisos</title>
<link rel="stylesheet" href="/admin/assets/common.css">
<style>
  .layout { display: grid; gap: 20px; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); align-items: start; }
  .composer { position: sticky; top: 16px; display: grid; gap: 13px; }
  .composer h2 { font-size: 17px; }
  fieldset { margin: 0; padding: 0; border: 0; }
  legend { padding: 0; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid #c6d1c9; border-radius: 999px; font-weight: 500; cursor: pointer; background: #fff; }
  .chip input { width: auto; margin: 0; accent-color: var(--brand); }
  .chip:has(input:checked) { background: var(--brand-soft); border-color: var(--brand); }
  .chip.all { font-weight: 700; }
  .composer-actions { display: flex; gap: 8px; }
  .composer-actions .primary { flex: 1; }
  .hint { margin: 0; color: var(--muted); font-size: 12px; }
  .list-head { display: grid; gap: 10px; grid-template-columns: 1fr minmax(130px, 190px); margin-bottom: 10px; }
  .list-head input, .list-head select { margin-top: 0; }
  #count { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .notice { margin-bottom: 10px; }
  .notice header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .notice h3 { font-size: 16px; overflow-wrap: anywhere; }
  .notice time { flex: none; color: var(--muted); font-size: 13px; }
  .notice p { margin: 6px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .notice footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .notice .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .notice .tools { display: flex; gap: 6px; }
  .notice.editing { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  @media (max-width: 800px) { .layout { grid-template-columns: minmax(0, 1fr); } .composer { position: static; } }
</style>
</head>
<body>
<main>
  <div class="page-title"><h1>Avisos</h1><p>Os responsáveis podem consultar estes avisos com o assistente da escola.</p></div>
  <div class="layout">
    <form class="card composer" id="composer">
      <h2 id="composer-title">Novo aviso</h2>
      <fieldset><legend>Para quais turmas?</legend><div class="chips" id="class-chips"></div></fieldset>
      <label>Título <input id="title" required maxlength="120" autocomplete="off"></label>
      <label>Mensagem <textarea id="body" required maxlength="2000"></textarea></label>
      <label>Data <input id="date" type="date" required></label>
      <div class="error" id="form-error" role="alert"></div>
      <div class="composer-actions">
        <button class="primary" id="submit" type="submit">Publicar aviso</button>
        <button type="button" id="cancel-edit" hidden>Cancelar</button>
      </div>
      <p class="hint">Dica: Ctrl ou ⌘ + Enter publica. As turmas e a data continuam selecionadas para o próximo aviso.</p>
    </form>
    <section aria-label="Avisos publicados">
      <div class="list-head">
        <input id="search" type="search" placeholder="Buscar nos avisos" aria-label="Buscar nos avisos">
        <select id="class-filter" aria-label="Filtrar por turma"></select>
      </div>
      <p id="count" aria-live="polite"></p>
      <div class="error" id="list-error" role="alert"></div>
      <div id="list"></div>
    </section>
  </div>
</main>
<script src="/admin/assets/common.js"></script>
<script>
(async () => {
  await Apolo.start();
  const { el, schoolApi, toast, today, formatDate } = Apolo;
  const $ = id => document.getElementById(id);
  let classes = [], notices = [], editing = null;
  const className = id => classes.find(item => item.id === id)?.name || id;
  const boxes = () => [...document.querySelectorAll('input[name="class"]')];

  function renderChips() {
    const all = el('input', { type: 'checkbox', id: 'all-classes', onchange: () => { boxes().forEach(box => { box.checked = all.checked; }); } });
    $('class-chips').replaceChildren(
      el('label', { class: 'chip all' }, all, 'Todas as turmas'),
      ...classes.map(item => el('label', { class: 'chip' }, el('input', {
        type: 'checkbox', name: 'class', value: item.id,
        onchange: () => { all.checked = boxes().every(box => box.checked); },
      }), item.name)),
    );
    $('class-filter').replaceChildren(new Option('Todas as turmas', ''), ...classes.map(item => new Option(item.name, item.id)));
  }

  function setClasses(ids) {
    boxes().forEach(box => { box.checked = ids.includes(box.value); });
    $('all-classes').checked = boxes().every(box => box.checked);
  }

  function resetEdit() {
    editing = null;
    $('composer-title').textContent = 'Novo aviso';
    $('submit').textContent = 'Publicar aviso';
    $('cancel-edit').hidden = true;
    $('title').value = '';
    $('body').value = '';
    $('form-error').textContent = '';
  }

  function startEdit(notice) {
    editing = notice;
    $('composer-title').textContent = 'Editar aviso';
    $('submit').textContent = 'Salvar alterações';
    $('cancel-edit').hidden = false;
    setClasses(notice.class_ids);
    $('title').value = notice.title;
    $('body').value = notice.body;
    $('date').value = notice.date;
    $('form-error').textContent = '';
    renderList();
    $('composer').scrollIntoView({ block: 'nearest' });
    $('title').focus();
  }

  async function removeNotice(notice) {
    const reach = notice.class_ids.length > 1 ? ` de ${notice.class_ids.length} turmas` : '';
    if (!confirm(`Excluir o aviso "${notice.title}"${reach}? Esta ação não pode ser desfeita.`)) return;
    $('list-error').textContent = '';
    try {
      await schoolApi('/notices/delete', 'POST', { ids: notice.ids });
      if (editing === notice) resetEdit();
      toast('Aviso excluído.');
      await loadNotices();
    } catch (error) { $('list-error').textContent = error.message; }
  }

  function renderList() {
    const query = $('search').value.trim().toLowerCase();
    const classId = $('class-filter').value;
    const shown = notices.filter(notice => (!classId || notice.class_ids.includes(classId))
      && (!query || `${notice.title} ${notice.body}`.toLowerCase().includes(query)));
    $('count').textContent = `${shown.length} de ${notices.length} ${notices.length === 1 ? 'aviso' : 'avisos'}`;
    $('list').replaceChildren(...(shown.length ? shown.map(notice => el('article', { class: `card notice${editing?.ids.join() === notice.ids.join() ? ' editing' : ''}` },
      el('header', {}, el('h3', {}, notice.title), el('time', { dateTime: notice.date }, formatDate(notice.date))),
      el('p', {}, notice.body),
      el('footer', {},
        el('div', { class: 'tags' }, ...notice.class_ids.map(id => el('span', { class: 'badge' }, className(id)))),
        el('div', { class: 'tools' },
          el('button', { class: 'small', type: 'button', onclick: () => startEdit(notice) }, 'Editar'),
          el('button', { class: 'small danger', type: 'button', onclick: () => removeNotice(notice) }, 'Excluir'))),
    )) : [el('div', { class: 'card empty' }, notices.length ? 'Nenhum aviso encontrado.' : 'Nenhum aviso ainda. Publique o primeiro ao lado.')]));
  }

  async function loadNotices() {
    notices = await schoolApi('/notices');
    if (editing) editing = notices.find(notice => notice.ids.join() === editing.ids.join()) || null;
    renderList();
  }

  $('composer').onsubmit = async event => {
    event.preventDefault();
    const class_ids = boxes().filter(box => box.checked).map(box => box.value);
    if (!class_ids.length) { $('form-error').textContent = 'Escolha pelo menos uma turma.'; return; }
    $('form-error').textContent = '';
    $('submit').disabled = true;
    try {
      const result = await schoolApi('/notices', 'POST', {
        class_ids, title: $('title').value, body: $('body').value, date: $('date').value, replace_ids: editing?.ids || [],
      });
      toast(editing ? 'Aviso atualizado.' : `Aviso publicado para ${result.classes} ${result.classes === 1 ? 'turma' : 'turmas'}.`);
      resetEdit();
      await loadNotices();
      $('title').focus();
    } catch (error) { $('form-error').textContent = error.message; } finally { $('submit').disabled = false; }
  };
  $('composer').onkeydown = event => { if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) $('composer').requestSubmit(); };
  $('cancel-edit').onclick = () => { resetEdit(); renderList(); };
  $('search').oninput = renderList;
  $('class-filter').onchange = renderList;
  Apolo.guardUnsaved(() => Boolean($('title').value.trim() || $('body').value.trim()) && !editing);

  $('date').value = today();
  try {
    ({ classes } = await schoolApi('/options'));
    renderChips();
    await loadNotices();
  } catch (error) { $('list-error').textContent = error.message; }
})();
</script>
</body>
</html>
